name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows build and regression tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared application
        run: dotnet build Racks.Overhaul.sln -c Release --warnaserror
      - name: Core regression tests
        run: dotnet test tests/Racks.Core.Tests -c Release --no-build --logger "trx;LogFileName=core.trx"
      - name: Existing Windows app and integration tests
        run: dotnet test tests/Racks.Windows.Tests -c Release --logger "trx;LogFileName=windows.trx" --warnaserror
      - name: Isolated real application smoke test
        shell: pwsh
        run: ./scripts/Test-Desktop.ps1 -Dotnet dotnet -Configuration Release
      - name: Signed feed and package generation with ephemeral keys
        shell: pwsh
        run: ./scripts/Test-ReleaseSigning.ps1 -Dotnet dotnet
      - name: Upgrade, uninstall and reinstall on disposable runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-Installer.ps1 -DisposableRunner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          include-hidden-files: true
          path: |
            tests/**/TestResults/*.trx
            .artifacts/smoke-*/smoke-result.json
            .artifacts/smoke-*/restart-result.json
            .artifacts/installer-result.json
            .artifacts/installer-logs/*.log
          retention-days: 14
  mac:
    name: Mac Apple Silicon foundation checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate Mac packaging inputs
        run: |
          bash -n scripts/Publish-Mac.sh
          plutil -lint installer/mac/Info.plist installer/mac/entitlements.plist
      - name: Build shared application
        run: dotnet build Racks.Overhaul.sln -c Release --warnaserror
      - name: Core regression tests
        run: dotnet test tests/Racks.Core.Tests -c Release --no-build --logger "trx;LogFileName=mac-core.trx"
      - name: Isolated native-window experiment
        shell: pwsh
        run: ./scripts/Test-Desktop.ps1 -Dotnet dotnet -Configuration Release
      - name: Signed feed and package generation with ephemeral keys
        shell: pwsh
        run: ./scripts/Test-ReleaseSigning.ps1 -Dotnet dotnet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-foundation-test-results
          include-hidden-files: true
          path: |
            tests/**/TestResults/*.trx
            .artifacts/smoke-*/smoke-result.json
            .artifacts/smoke-*/restart-result.json
          retention-days: 14
