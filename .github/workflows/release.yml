name: release

# Run by hand, choosing the tag (for example v1.2.0) as the ref, to build the installer and upload it
# to a DRAFT GitHub release.
# CI never signs updates and never publishes: the owner checks the draft against this run, signs it
# with the key that only exists on their machine, and publishes it (tools/release-sign.ps1,
# docs/RELEASING.md). The updater ignores any release without that signature.
# The tag must match <Version> in Racks/Racks.csproj.
#
# Optional Authenticode signing (off unless the repository variable SIGNPATH_ENABLED is 'true'):
# Racks.exe and the installer are signed by SignPath Foundation, each request approved by hand
# in SignPath, before they are zipped and checksummed (docs/CODE-SIGNING-POLICY.md, docs/RELEASING.md).
# This signs the files for Windows only; the update signature above is still the owner's.
#
# Hardening: third-party code is pinned by full commit SHA (update the pins by hand and read the diff),
# no job gets more permission than it needs, the checkout does not keep the token, and nothing
# from the event (tag name) is pasted into a script: it goes through env.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    permissions:
      contents: read
      # Read-only. Only the SignPath steps use it: the action downloads the unsigned artifact with the
      # job token and the docs ask for actions: read + contents: read.
      actions: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      installer-sha256: ${{ steps.package.outputs.installer-sha256 }}
    env:
      # Inno Setup is downloaded from the vendor and checked against this SHA-256 (the value
      # Chocolatey's moderated package records for the same file) and its Authenticode publisher.
      # To upgrade: change both values together (docs/RELEASING.md).
      INNO_VERSION: 6.7.1
      INNO_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check tag matches csproj version
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -cnotmatch '\Av(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\z') {
            throw "Tag '$env:TAG' is not of the form vX.Y.Z"
          }
          $tag = $env:TAG.Substring(1)
          [xml]$csproj = Get-Content Racks/Racks.csproj
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($tag -cne $version) { throw "Tag v$tag does not match <Version> $version in Racks.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: |
          dotnet restore Racks.sln
          dotnet build Racks.sln -c Release --no-restore
          dotnet test Racks.sln -c Release --no-build

      - name: Check the update signing key is set (release gate test)
        shell: pwsh
        env:
          RACKS_RELEASE_GATE: '1'
        run: |
          # A release built without a real update key could never verify (and so never install) a
          # later update. The test parses the key the build compiled in, so any placeholder or
          # malformed value fails, not just one spelling. Set it once with RacksSigner keygen
          # (docs/RELEASING.md).
          $out = dotnet test Racks.sln -c Release --no-build --filter "Category=ReleaseGate" 2>&1
          $out | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "The release gate test failed: Racks/Util/UpdateTrust.cs has no real update signing key." }
          if (-not ($out -match 'Passed:\s+1,') -or -not ($out -match 'Skipped:\s+0,')) {
            throw "The release gate test did not run."
          }

      - name: Install pinned Inno Setup
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = Join-Path $env:RUNNER_TEMP 'innosetup-download'
          New-Item -ItemType Directory -Force $dl | Out-Null
          $exe = Join-Path $dl "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-$env:INNO_VERSION.exe" -OutFile $exe -UseBasicParsing
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup download hash $hash does not match the pinned $env:INNO_SHA256" }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          }
          $target = Join-Path $env:RUNNER_TEMP 'innosetup'
          $p = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($p.ExitCode)" }
          $iscc = Join-Path $target 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found in $target" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build installer
        if: ${{ vars.SIGNPATH_ENABLED != 'true' }}
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: ./build-installer.ps1 -IsccPath $env:ISCC

      # ---- Authenticode signing through SignPath Foundation (only with SIGNPATH_ENABLED == 'true') ----
      # Replaces the "Build installer" step above: publish, sign Racks.exe, build the installer from the
      # signed exe, sign the installer, verify both. Every step below is skipped when the switch is off.
      # A signing request waits for the owner to approve it in SignPath (up to 2 hours each).

      - name: Publish the app (for signing)
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./publish.ps1 -SelfContained
          if (-not (Test-Path publish/Racks.exe)) { throw "publish/Racks.exe was not produced" }

      - name: Upload unsigned Racks.exe
        id: unsigned-exe
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-racks-exe-${{ steps.ver.outputs.version }}
          path: publish/Racks.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Racks.exe (SignPath, manual approval)
        id: sign-exe
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/exe

      - name: Put the signed Racks.exe in publish/
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = 'signed/exe/Racks.exe'
          if (-not (Test-Path $signed)) { throw "SignPath returned no Racks.exe in signed/exe" }
          Copy-Item $signed publish/Racks.exe -Force

      - name: Build installer from the signed app
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: ./build-installer.ps1 -IsccPath $env:ISCC -SkipPublish

      - name: Stage the installer for signing
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force signing-input | Out-Null
          Copy-Item "installer/Output/Racks-Setup-$env:VERSION.exe" signing-input/Racks-Setup.exe -Force

      - name: Upload unsigned installer
        id: unsigned-setup
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-racks-setup-${{ steps.ver.outputs.version }}
          path: signing-input/Racks-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath, manual approval)
        id: sign-setup
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/setup

      - name: Put the signed installer in installer/Output
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = 'signed/setup/Racks-Setup.exe'
          if (-not (Test-Path $signed)) { throw "SignPath returned no Racks-Setup.exe in signed/setup" }
          Copy-Item $signed "installer/Output/Racks-Setup-$env:VERSION.exe" -Force

      - name: Verify the Authenticode signatures (SignPath Foundation)
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Nothing unsigned or signed by someone else gets past this point: the zip, SHA256SUMS.txt and
          # the draft are built after it from these two files. This checks WHO signed (a valid signature
          # whose subject is exactly the SignPath Foundation CN), not that the content equals what was
          # uploaded: that rests on SignPath and the owner's approval (docs/RELEASING.md).
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('publish/Racks.exe', "installer/Output/Racks-Setup-$env:VERSION.exe")) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch '^CN=SignPath Foundation(,|$)') {
              throw "$file is not validly signed by SignPath Foundation: $($sig.Status) / $($sig.SignerCertificate.Subject)"
            }
            Write-Host "$file : $($sig.Status), $($sig.SignerCertificate.Subject)"
          }

      - name: Package portable zip and checksums
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          $assets = 'dist/assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          Copy-Item "installer/Output/Racks-Setup-$v.exe" $assets
          Compress-Archive -Path publish/* -DestinationPath "$assets/Racks-portable-$v.zip"
          $lines = Get-ChildItem -File $assets | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          # LF line endings so `sha256sum -c` works anywhere.
          [IO.File]::WriteAllText((Join-Path (Resolve-Path $assets) 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"))
          $h = (Get-FileHash "$assets/Racks-Setup-$v.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "installer-sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Length - 1)]
            $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
            $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
            $body -join "`n" | Set-Content dist/release-notes.md
          } else {
            "See CHANGELOG.md." | Set-Content dist/release-notes.md
          }

      - name: Upload build output
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Upload to a draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true

      - name: Verify the files are the ones the build job produced
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.installer-sha256 }}
        run: |
          set -euo pipefail
          cd dist/assets
          sha256sum -c SHA256SUMS.txt
          actual="$(sha256sum "Racks-Setup-${VERSION}.exe" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "Installer digest $actual does not match the build job's $EXPECTED_SHA256" >&2
            exit 1
          fi

      - name: Create draft release (never published by CI)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file dist/release-notes.md \
            "dist/assets/Racks-Setup-${VERSION}.exe" \
            "dist/assets/Racks-portable-${VERSION}.zip" \
            "dist/assets/SHA256SUMS.txt"
          echo "Draft created for $TAG. Sign and publish it locally with tools/release-sign.ps1 -Version $VERSION" >> "$GITHUB_STEP_SUMMARY"
